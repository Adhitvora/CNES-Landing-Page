<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 990" role="img" aria-labelledby="title desc">
  <title id="title">FWPI Membership Certificate</title>
  <desc id="desc">Temporary premium certificate artwork for FWPI membership.</desc>
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#f2ead8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#9f7a1c"/>
      <stop offset="0.25" stop-color="#f4d87a"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="0.75" stop-color="#fff1b8"/>
      <stop offset="1" stop-color="#9f7a1c"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#07111f" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1400" height="990" fill="#07111f"/>
  <rect x="70" y="70" width="1260" height="850" rx="18" fill="url(#paper)" filter="url(#shadow)"/>
  <rect x="108" y="108" width="1184" height="774" rx="8" fill="none" stroke="url(#gold)" stroke-width="14"/>
  <rect x="136" y="136" width="1128" height="718" rx="4" fill="none" stroke="#d4af37" stroke-width="2" opacity="0.5"/>
  <path d="M188 218h1024M188 772h1024" stroke="url(#gold)" stroke-width="4" opacity="0.72"/>
  <circle cx="700" cy="290" r="88" fill="#07111f"/>
  <text x="700" y="317" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="66" font-weight="800" fill="#ffffff">FWPI</text>
  <text x="700" y="438" text-anchor="middle" font-family="Georgia, serif" font-size="58" fill="#07111f">Certificate of Membership</text>
  <text x="700" y="502" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="22" letter-spacing="7" fill="#9f7a1c">FITNESS &amp; WELLNESS PROFESSIONALS OF INDIA</text>
  <text x="700" y="592" text-anchor="middle" font-family="Georgia, serif" font-size="40" fill="#172033">CNES-CPT Graduate</text>
  <text x="700" y="648" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="24" fill="#4b5563">is recognized as an active professional member</text>
  <path d="M502 716h220M784 716h220" stroke="#9ca3af" stroke-width="2"/>
  <text x="612" y="754" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#6b7280">Authorized Signatory</text>
  <text x="894" y="754" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="18" fill="#6b7280">Membership Seal</text>
  <circle cx="894" cy="678" r="48" fill="none" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="894" cy="678" r="34" fill="none" stroke="#d4af37" stroke-width="2"/>
  <text x="894" y="686" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#9f7a1c">FWPI</text>
